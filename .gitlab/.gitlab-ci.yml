# USBSID-Configtool GitLab CI/CD configuration
#
# Mirrors the GitHub Actions workflow .github/workflows/ci-tagged-build-or-release.yml:
#   test     -> test:linux                      unit tests
#   ci       -> ci:linux                        uberjar + launchers under Xvfb
#   package  -> package:*                       platform packages, tags only
#   cleanup  -> cleanup:old-snapshots           d* tags
#   prerelease / release -> create:snapshot / create:release
#
# Supports two GitLab instances:
#   - gitlab.loudai.nl (private): Linux, Windows and macOS 15 Intel runners
#   - gitlab.com (public): Linux, macOS (Apple Silicon) and Windows runners
#
# The Windows and macOS package jobs install their own JDK and Clojure and are
# allowed to fail: a release is still created from what did build. Remove
# allow_failure once they have been seen passing.

variables:
  # Java 25 (Temurin) on Ubuntu 24.04. The package names below assume noble.
  JAVA_IMAGE: "eclipse-temurin:25-jdk-noble"
  # Same as the GitHub workflow, the install dir there says 1.1 for a 1.2 jar
  DRIVERJAR: "usbsid-usb-driver-library-java-1.2.jar"
  DRIVERPOM: "usbsid-usb-driver-library-java-1.2.pom"
  # Clojure CLI installer, what setup-clojure runs on GitHub
  CLOJURE_INSTALLER_URL: "https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh"
  # Instance with the Intel macOS runner (no Apple Silicon runner there)
  PRIVATE_HOST: "gitlab.loudai.nl"
  # Pipelines on any instance other than PRIVATE_HOST (gitlab.com) are off.
  # The jobs stay in this file; set this to "true" here, or as a CI/CD variable
  # in the gitlab.com project, to run them again.
  PUBLIC_PIPELINES_ENABLED: "false"
  # Windows runner tag. The default is the gitlab.com SaaS runner, set this
  # in the project CI/CD variables on an instance with its own Windows runner.
  WINDOWS_RUNNER_TAG: "saas-windows-medium-amd64"
  # Linux runner tag, the default for every job without its own tags (see
  # default: below). Without it an untagged job can land on the macOS shell
  # runner, which has no apt-get and ignores image:. "linux" is a tag of the
  # private instance's Linux runner. gitlab.com SaaS runners do not carry it, so
  # set this to "saas-linux-small-amd64" in the gitlab.com project's CI/CD
  # variables together with PUBLIC_PIPELINES_ENABLED.
  LINUX_RUNNER_TAG: "linux"

# Pipeline runs on:
# - branch pushes and merge requests (one pipeline per push, not two)
# - d* tags: tagged build prerelease
# - v* tags: versioned release
workflow:
  rules:
    # Nothing runs outside PRIVATE_HOST unless PUBLIC_PIPELINES_ENABLED is "true"
    - if: $CI_SERVER_HOST != $PRIVATE_HOST && $PUBLIC_PIPELINES_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PIPELINE_TYPE: "dev"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
      variables:
        PIPELINE_TYPE: "dev"
    - if: $CI_COMMIT_TAG =~ /^d[0-9].*$/
      variables:
        PIPELINE_TYPE: "snapshot"
    - if: $CI_COMMIT_TAG =~ /^v[0-9].*$/
      variables:
        PIPELINE_TYPE: "release"

stages:
  - test
  - build
  - package
  - collect
  - release

default:
  interruptible: true
  # Jobs with their own tags (Windows, macOS) replace this
  tags:
    - $LINUX_RUNNER_TAG

# ============================================================================
# RULE SETS
# ============================================================================

.rules_all:
  rules:
    - if: $PIPELINE_TYPE

.rules_tagged:
  rules:
    - if: $PIPELINE_TYPE == "snapshot" || $PIPELINE_TYPE == "release"

# Apple Silicon macOS runner only exists on gitlab.com
.rules_tagged_macos:
  rules:
    - if: ($PIPELINE_TYPE == "snapshot" || $PIPELINE_TYPE == "release") && $CI_SERVER_HOST != $PRIVATE_HOST

# Intel macOS runner only exists on the private instance
.rules_tagged_macos15intel:
  rules:
    - if: ($PIPELINE_TYPE == "snapshot" || $PIPELINE_TYPE == "release") && $CI_SERVER_HOST == $PRIVATE_HOST

# ============================================================================
# SHARED PIECES
# ============================================================================

# The Java driver jar goes into the local Maven repo by hand (it is not on
# Maven Central), and so do the patched libusb4java native libs. See
# scripts/install-libusb4java.sh for why the stock ones do not work on Windows.
.install_driver_unix:
  script:
    - DIR="$HOME/.m2/repository/usbsid/usbsid-usb-driver-library-java/1.1"
    - mkdir -p "$DIR"
    - cp "assets/driver/${DRIVERJAR}" "$DIR/"
    - cp "assets/driver/${DRIVERPOM}" "$DIR/"
    - ./scripts/install-libusb4java.sh

# Ubuntu image with the JDK. Clojure CLI is installed with the official
# script, which is what setup-clojure does on GitHub. JavaFX needs GTK and
# friends at runtime, and the tests and the CI build run it under Xvfb.
# ~/.m2 is a symlink into the project dir so the Maven cache can be cached.
.clojure_linux:
  image: ${JAVA_IMAGE}
  variables:
    DEBIAN_FRONTEND: noninteractive
  cache:
    key:
      prefix: m2
      files:
        - deps.edn
    paths:
      - .m2/
  before_script:
    - apt-get update
    - apt-get install -y curl git zip unzip file binutils xvfb libgtk-3-0 libxtst6 libxxf86vm1 libgl1 libasound2t64
    - curl -fsSL "${CLOJURE_INSTALLER_URL}" -o /tmp/linux-install.sh
    - bash /tmp/linux-install.sh
    - mkdir -p "${CI_PROJECT_DIR}/.m2"
    - rm -rf "${HOME}/.m2"
    - ln -s "${CI_PROJECT_DIR}/.m2" "${HOME}/.m2"
    - !reference [.install_driver_unix, script]

# ============================================================================
# TEST AND CI BUILD (test, ci)
# ============================================================================

# Runs on branches, merge requests and tags alike, like GitHub. Tags then go on
# to package the platform builds.
test:linux:
  extends:
    - .clojure_linux
    - .rules_all
  stage: test
  script:
    - clojure -T:build test

# Full CI pipeline: tests + uberjar + launcher scripts
ci:linux:
  extends:
    - .clojure_linux
    - .rules_all
  stage: build
  variables:
    NO_AT_BRIDGE: "1"
  script:
    - xvfb-run -a clojure -T:build ci
  artifacts:
    name: "jar-and-launchers"
    paths:
      - target/usbsid-configtool-*.jar
      - target/run.sh
      - target/run.bat
    expire_in: 1 week
  needs:
    - job: test:linux

# ============================================================================
# PLATFORM PACKAGES (package, tags only)
# The uberjar is built again on every platform runner so build.clj's
# host-jfx-alias picks the matching JavaFX classifier for the host. Reusing the
# Ubuntu built one would never pull in the mac dylibs, and the .app would fail
# with "no suitable pipeline".
# Output is staged with platform tagged names so all of them can coexist.
# ============================================================================

# Linux: a jpackage app-image (zipped directory) and a self-contained AppImage
package:linux:
  extends:
    - .clojure_linux
    - .rules_tagged
  stage: package
  parallel:
    matrix:
      - PLATFORM: [linux, linux-appimage]
  script:
    - clojure -T:build uber
    - clojure -T:build package
    - |
      if [ "$PLATFORM" = "linux-appimage" ]; then
        bash scripts/build-appimage.sh
      fi
    - |
      VERSION=$(cat resources/.version | tr -d '[:space:]')
      mkdir -p staging
      if [ "$PLATFORM" = "linux" ]; then
        (cd target/package && zip -r "../../staging/USBSID-Configtool-${VERSION}-linux.zip" USBSID-Configtool/)
      else
        cp target/appimage/*.AppImage staging/
      fi
      ls -la staging
  artifacts:
    name: "package-${PLATFORM}"
    paths:
      - staging/*
    expire_in: 4 weeks
  needs:
    - job: ci:linux

# macOS Apple Silicon (jpackage .dmg), gitlab.com SaaS runner
package:macos-arm:
  extends: .rules_tagged_macos
  stage: package
  tags:
    - saas-macos-medium-m1
  image: macos-14-xcode-15
  allow_failure: true
  variables:
    PLATFORM: "macos-arm"
  before_script:
    - brew update
    - brew install --cask temurin@25 || brew install --cask temurin
    - brew install clojure/tools/clojure
    - export JAVA_HOME=$(/usr/libexec/java_home -v 25)
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - !reference [.install_driver_unix, script]
  script:
    - clojure -T:build uber
    - clojure -T:build package
    - |
      VERSION=$(cat resources/.version | tr -d '[:space:]')
      mkdir -p staging
      cp target/package/*.dmg "staging/USBSID-Configtool-${VERSION}-macos-aarch64.dmg"
      ls -la staging
  artifacts:
    name: "package-macos-arm"
    paths:
      - staging/*
    expire_in: 4 weeks
  needs:
    - job: ci:linux
      artifacts: false

# macOS Intel (jpackage .dmg), private instance's own runner (shell executor
# on real hardware, no Docker image to pick). ARM runner on the same Mac is
# planned but not set up yet, so this stays Intel only for now.
# The runner user has no passwordless sudo, so no brew casks (their .pkg
# installers need sudo), and Homebrew has no bottles for Intel macOS any more.
# A JDK 25 already installed on the Mac is used as is. Otherwise the Temurin
# tarball and the Clojure CLI are installed under MACOS_TOOLS_DIR, outside the
# build dir, so later jobs reuse them. MACOS_TOOLS_DIR is set in the script,
# GitLab does not expand $HOME in variables:.
package:macos15-intel:
  extends: .rules_tagged_macos15intel
  stage: package
  tags:
    - macos-15-intel
  allow_failure: true
  variables:
    PLATFORM: "macos-15-intel"
    TEMURIN_MACOS_URL: "https://api.adoptium.net/v3/binary/latest/25/ga/mac/x64/jdk/hotspot/normal/eclipse"
    CLOJURE_POSIX_INSTALLER_URL: "https://github.com/clojure/brew-install/releases/latest/download/posix-install.sh"
  before_script:
    - export MACOS_TOOLS_DIR="$HOME/.cache/usbsid-ci"
    - |
      if ! JAVA_HOME=$(/usr/libexec/java_home -v 25 2>/dev/null); then
        JDK_DIR="${MACOS_TOOLS_DIR}/temurin-25"
        if [ ! -x "${JDK_DIR}/Contents/Home/bin/java" ]; then
          rm -rf "${JDK_DIR}"
          mkdir -p "${JDK_DIR}"
          curl -fsSL "${TEMURIN_MACOS_URL}" | tar -xz -C "${JDK_DIR}" --strip-components 1
        fi
        JAVA_HOME="${JDK_DIR}/Contents/Home"
      fi
      export JAVA_HOME
    - export PATH="$JAVA_HOME/bin:${MACOS_TOOLS_DIR}/clojure/bin:$PATH"
    - java -version
    - |
      if ! command -v clojure >/dev/null; then
        CLJ_TMP=$(mktemp -d)
        curl -fsSL "${CLOJURE_POSIX_INSTALLER_URL}" -o "${CLJ_TMP}/posix-install.sh"
        (cd "${CLJ_TMP}" && sh posix-install.sh --prefix "${MACOS_TOOLS_DIR}/clojure")
        rm -rf "${CLJ_TMP}"
      fi
    - clojure --version
    - !reference [.install_driver_unix, script]
  script:
    - clojure -T:build uber
    - clojure -T:build package
    - |
      VERSION=$(cat resources/.version | tr -d '[:space:]')
      mkdir -p staging
      cp target/package/*.dmg "staging/USBSID-Configtool-${VERSION}-macos-x86_64.dmg"
      ls -la staging
  artifacts:
    name: "package-macos15-intel"
    paths:
      - staging/*
    expire_in: 4 weeks
  needs:
    - job: ci:linux
      artifacts: false

# Windows (jpackage .msi, needs the WiX toolset), gitlab.com SaaS runner by default.
# The runner shell is PowerShell. The Clojure CLI is the official ClojureTools
# module. It is not on the PowerShell Gallery (Install-Module cannot find it)
# and win-install.ps1 asks for the install location, so the module zip from
# the clojure/brew-install release is unpacked into the build dir and added to
# PSModulePath. -T:build stays unquoted: PowerShell hands it to the module
# function as two args, "-T:" and "build", which is the form ClojureTools
# parses as the :build alias. Quoted it arrives as one string and the module
# reads it as a tool named ":build" ("Unknown tool: :build").
# PowerShell goes on after most errors, so every step that matters stops the
# job itself (-ErrorAction Stop, $LASTEXITCODE checks). Without that the job
# only fails several errors later and the log hides the real cause.
package:windows:
  extends: .rules_tagged
  stage: package
  tags:
    - $WINDOWS_RUNNER_TAG
  allow_failure: true
  variables:
    PLATFORM: "windows"
    CLOJURE_TOOLS_ZIP_URL: "https://github.com/clojure/brew-install/releases/latest/download/clojure-tools.zip"
  before_script:
    - choco install temurin25 wixtoolset -y --no-progress
    - |
      $jdk = Get-ChildItem "C:\Program Files\Eclipse Adoptium" -Directory -ErrorAction Stop | Where-Object Name -like "jdk-25*" | Select-Object -First 1
      if (-not $jdk) { throw "JDK 25 not found in C:\Program Files\Eclipse Adoptium" }
      $env:JAVA_HOME = $jdk.FullName
      $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
      if (-not $wix) { throw "WiX Toolset not found in C:\Program Files (x86)" }
      $env:PATH = "$env:JAVA_HOME\bin;$($wix.FullName)\bin;$env:PATH"
      java -version
      if ($LASTEXITCODE -ne 0) { throw "java -version failed" }
    - |
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      $ProgressPreference = "SilentlyContinue"
      $modules = Join-Path $env:CI_PROJECT_DIR ".psmodules"
      Remove-Item -Recurse -Force $modules -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force $modules | Out-Null
      Invoke-WebRequest -Uri $env:CLOJURE_TOOLS_ZIP_URL -OutFile "$modules\clojure-tools.zip" -UseBasicParsing -ErrorAction Stop
      Expand-Archive "$modules\clojure-tools.zip" -DestinationPath $modules -Force -ErrorAction Stop
      Remove-Item "$modules\clojure-tools.zip"
      $env:PSModulePath = "$modules;$env:PSModulePath"
      Import-Module ClojureTools -ErrorAction Stop
    - |
      $dir = "$HOME\.m2\repository\usbsid\usbsid-usb-driver-library-java\1.1"
      New-Item -ItemType Directory -Force $dir | Out-Null
      Copy-Item "assets/driver/$env:DRIVERJAR" $dir -ErrorAction Stop
      Copy-Item "assets/driver/$env:DRIVERPOM" $dir -ErrorAction Stop
      & "C:\Program Files\Git\bin\bash.exe" scripts/install-libusb4java.sh
      if ($LASTEXITCODE -ne 0) { throw "install-libusb4java.sh failed" }
  script:
    - |
      $jdk = Get-ChildItem "C:\Program Files\Eclipse Adoptium" -Directory | Where-Object Name -like "jdk-25*" | Select-Object -First 1
      $wix = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
      $env:JAVA_HOME = $jdk.FullName
      $env:PATH = "$env:JAVA_HOME\bin;$($wix.FullName)\bin;$env:PATH"
      $env:PSModulePath = "$(Join-Path $env:CI_PROJECT_DIR '.psmodules');$env:PSModulePath"
      Import-Module ClojureTools -ErrorAction Stop
      clojure -T:build uber
      if ($LASTEXITCODE -ne 0) { throw "clojure -T:build uber failed" }
      clojure -T:build package
      if ($LASTEXITCODE -ne 0) { throw "clojure -T:build package failed" }
      $version = (Get-Content resources/.version -Raw).Trim()
      New-Item -ItemType Directory -Force staging | Out-Null
      $msi = Get-ChildItem target/package/*.msi -ErrorAction Stop | Select-Object -First 1
      if (-not $msi) { throw "no .msi in target/package" }
      Copy-Item $msi.FullName "staging/USBSID-Configtool-$version-windows.msi" -ErrorAction Stop
  artifacts:
    name: "package-windows"
    paths:
      - staging/*
    expire_in: 4 weeks
  needs:
    - job: ci:linux
      artifacts: false

# ============================================================================
# COLLECT (release / prerelease file set)
# ============================================================================

# Delete snapshot prereleases older than 30 days, but keep the newest 10.
# Needs a GitLab API token in the GITLAB_API_TOKEN CI/CD variable, skipped
# without one. Only releases are deleted, the d* tags stay.
cleanup:old-snapshots:
  stage: collect
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ -z "${GITLAB_API_TOKEN:-}" ]; then
        echo "GITLAB_API_TOKEN not set, skipping cleanup"
        exit 0
      fi
      API_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      releases=$(curl -fsS --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${API_URL}?per_page=100")
      # Newest first, skip the first 10, then keep everything younger than 30 days
      echo "$releases" | jq -r --argjson now "$(date +%s)" '
        [ .[] | select(.tag_name | test("^d[0-9a-z]+$")) ]
        | sort_by(.created_at) | reverse
        | to_entries[] | select(.key >= 10)
        | select(($now - (.value.created_at | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601)) > 30 * 86400)
        | .value.tag_name' | while read -r tag; do
        echo "Deleting old snapshot prerelease: ${tag}"
        curl -fsS --request DELETE --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${API_URL}/${tag}" > /dev/null
      done
      echo "Cleanup complete"
  rules:
    - if: $PIPELINE_TYPE == "snapshot"
  allow_failure: true

# Platform packages + jar + launchers in one place. Apple Silicon macOS only
# exists on gitlab.com, Intel macOS only on the private instance, hence both
# optional.
collect:files:
  stage: collect
  image: alpine:latest
  variables:
    GIT_STRATEGY: none
  script:
    - mkdir -p release
    - cp -v staging/* release/
    - cp -v target/usbsid-configtool-*.jar target/run.sh target/run.bat release/
    - ls -la release
  artifacts:
    name: "usbsid-configtool-release"
    paths:
      - release/
    expire_in: never
  needs:
    - job: ci:linux
    - job: package:linux
      parallel:
        matrix:
          - PLATFORM: [linux, linux-appimage]
    - job: package:macos-arm
      optional: true
    - job: package:macos15-intel
      optional: true
    - job: package:windows
  rules:
    - if: $PIPELINE_TYPE == "snapshot" || $PIPELINE_TYPE == "release"

# Commits since the previous v* tag, for the release description
collect:notes:
  stage: collect
  image: alpine:latest
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
  script:
    - |
      echo "**Commits in this release:**" > release_notes.md
      PREV=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${CI_COMMIT_TAG}\$" | head -n 1 || true)
      if [ -n "$PREV" ]; then
        git log "${PREV}..HEAD" --oneline >> release_notes.md
      else
        git log --oneline >> release_notes.md
      fi
      cat release_notes.md
  artifacts:
    paths:
      - release_notes.md
    expire_in: 4 weeks
  rules:
    - if: $PIPELINE_TYPE == "release"

# ============================================================================
# RELEASE
# ============================================================================

# Tagged build pre-release, d* tags only
create:snapshot:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating pre-release for ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "Tagged build ${CI_COMMIT_TAG}"
    description: |
      ## Tagged build ${CI_COMMIT_TAG}

      Automated build for testing purposes.
      This is a prerelease and may contain bugs.
    assets:
      links:
        - name: "Release files, browse"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/release?job=collect:files"
          link_type: "package"
        - name: "Release files, download all"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=collect:files"
          link_type: "package"
  needs:
    - job: collect:files
      artifacts: false
  rules:
    - if: $PIPELINE_TYPE == "snapshot"

# Stable release, v* tags only
create:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "Release ${CI_COMMIT_TAG}"
    description: release_notes.md
    assets:
      links:
        - name: "Release files, browse"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/release?job=collect:files"
          link_type: "package"
        - name: "Release files, download all"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/download?job=collect:files"
          link_type: "package"
  needs:
    - job: collect:files
      artifacts: false
    - job: collect:notes
  rules:
    - if: $PIPELINE_TYPE == "release"
