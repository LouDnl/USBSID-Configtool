# Gitea Actions copy of .github/workflows/ci-tagged-build-or-release.yml (git.loudai.nl). Gitea runs
# .gitea/workflows/ and ignores .github/workflows/ when this directory exists.
# Differences: no macos-14 (no Apple Silicon runner), repositories under
# LouDnl/ on GitHub live under usbsid/ here, releases go through Gitea's API.

name: CI / Build / Release

on:
  push:
    branches: ['**']
    tags:
      - 'd[0-9]*'  # e.g. d20260601    - tagged build
      - 'v[0-9]*'  # e.g. v0.1.0-ALPHA - versioned release
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DRIVERVER: "1.2.1"
  DRIVERJAR: usbsid-usb-driver-library-java-1.2.1.jar
  DRIVERPOM: usbsid-usb-driver-library-java-1.2.1.pom

jobs:

  # 0. Pick a Clojure CLI version that has both a Linux/mac script and a Windows MSI
  clojure-version:
    name: Resolve Clojure CLI version
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.pick.outputs.cli }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick CLI version
        id: pick
        shell: bash
        run: |
          CLJ=$(grep -oE 'org\.clojure/clojure[[:space:]]+\{:mvn/version[[:space:]]+"[0-9]+\.[0-9]+\.[0-9]+"' deps.edn | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "deps.edn clojure: $CLJ"
          # Anonymous GitHub API, paged; $1 = url, $2 = json key to print
          fetch() {
            local p body names
            for p in 1 2 3 4 5; do
              body=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -H 'Accept: application/vnd.github+json' "$1&page=$p") || return 1
              names=$(printf '%s' "$body" | python3 -c 'import json,sys; [print(x.get(sys.argv[1], "")) for x in json.load(sys.stdin)]' "$2") || return 1
              [ -z "$names" ] && break
              printf '%s\n' "$names"
            done
          }
          BREW=$(fetch 'https://api.github.com/repos/clojure/brew-install/tags?per_page=100' name | sort -u) || BREW=""
          MSI=$(fetch 'https://api.github.com/repos/casselc/clj-msi/releases?per_page=100' tag_name | sed 's/^v//' | sort -u) || MSI=""
          CLI=""
          if [ -n "$CLJ" ] && [ -n "$BREW" ] && [ -n "$MSI" ]; then
            CLI=$(comm -12 <(printf '%s\n' "$BREW") <(printf '%s\n' "$MSI") | grep -F "$CLJ." | grep -E "^${CLJ//./\\.}\.[0-9.]+$" | sort -V | tail -n1)
          fi
          if [ -z "$CLI" ]; then
            echo "::warning::deps.edn clojure ${CLJ:-unknown} had no matching CLI build in both lists, using stable"
            CLI=$(curl -fsSL --retry 5 --retry-all-errors https://download.clojure.org/install/stable.properties | awk '{print $1; exit}')
          fi
          echo "Clojure CLI: $CLI"
          echo "cli=$CLI" >> "$GITHUB_OUTPUT"

  # 1. Unit tests - Ubuntu only
  test:
    name: Tests (Ubuntu)
    runs-on: ubuntu-latest
    needs: [clojure-version]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI ${{ needs.clojure-version.outputs.cli }}
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            -o "$RUNNER_TEMP/clj-install.sh" "https://download.clojure.org/install/linux-install-${{ needs.clojure-version.outputs.cli }}.sh"
          chmod +x "$RUNNER_TEMP/clj-install.sh"
          $SUDO "$RUNNER_TEMP/clj-install.sh"
          clojure -Sdescribe >/dev/null && clojure --version

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install USBSID driver
        shell: bash
        run: |
          DIR="$HOME/.m2/repository/usbsid/usbsid-usb-driver-library-java/${{ env.DRIVERVER }}"
          mkdir -p "$DIR"
          cp assets/driver/${{ env.DRIVERJAR }} "$DIR/"
          cp assets/driver/${{ env.DRIVERPOM }} "$DIR/"

      - name: Install patched libusb4java (Windows native lib fix)
        shell: bash
        run: ./scripts/install-libusb4java.sh

      - name: Run tests
        run: clojure -T:build test

  # 2. CI build - Ubuntu only
  ci:
    name: CI Build (Ubuntu)
    runs-on: ubuntu-latest
    needs: [test, clojure-version]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Clojure CLI ${{ needs.clojure-version.outputs.cli }}
        run: |
          if command -v sudo >/dev/null; then SUDO=sudo; else SUDO=; fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 \
            -o "$RUNNER_TEMP/clj-install.sh" "https://download.clojure.org/install/linux-install-${{ needs.clojure-version.outputs.cli }}.sh"
          chmod +x "$RUNNER_TEMP/clj-install.sh"
          $SUDO "$RUNNER_TEMP/clj-install.sh"
          clojure -Sdescribe >/dev/null && clojure --version

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install USBSID driver
        shell: bash
        run: |
          DIR="$HOME/.m2/repository/usbsid/usbsid-usb-driver-library-java/${{ env.DRIVERVER }}"
          mkdir -p "$DIR"
          cp assets/driver/${{ env.DRIVERJAR }} "$DIR/"
          cp assets/driver/${{ env.DRIVERPOM }} "$DIR/"

      - name: Install patched libusb4java (Windows native lib fix)
        shell: bash
        run: ./scripts/install-libusb4java.sh

      - name: Install Xvfb
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y xvfb

      - name: CI build (uber + launchers)
        env:
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a clojure -T:build ci

      - name: Upload JAR and launchers
        uses: actions/upload-artifact@v4
        with:
          name: jar-and-launchers
          path: |
            target/usbsid-configtool-*.jar
            target/run.sh
            target/run.bat

  # 3. Platform packages - tagged snapshots (d*) and releases (v*)
  package:
    name: Package (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci, clojure-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux            # jpackage app-image (zipped directory)
          - os: ubuntu-latest
            platform: linux-appimage   # self-contained .AppImage
          - os: ubuntu-24.04-arm       # arm64, free hosted runner for public repos
            platform: linux-appimage-aarch64
          - os: windows-latest
            platform: windows          # jpackage .msi installer
          - os: macos-15-intel         # Intel x86_64
            platform: macos-intel      # jpackage .dmg

    steps:
      # Full history + tags: build-appimage.sh dates AppStream releases by tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ startsWith(matrix.platform, 'linux-appimage') && '0' || '1' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Attempt 1; on failure wait and retry once (non-Windows only, see below)
      - name: Setup Clojure CLI (attempt 1)
        id: clj1
        if: runner.os != 'Windows'
        continue-on-error: true
        uses: DeLaGuardo/setup-clojure@13.5.3
        with:
          # Gitea's token is not valid on GitHub's API; ask anonymously.
          github-token: ''
          cli: ${{ needs.clojure-version.outputs.cli }}

      - name: Wait before Clojure CLI retry
        if: runner.os != 'Windows' && steps.clj1.outcome == 'failure'
        shell: bash
        run: sleep 45

      - name: Setup Clojure CLI (attempt 2)
        if: runner.os != 'Windows' && steps.clj1.outcome == 'failure'
        uses: DeLaGuardo/setup-clojure@13.5.3
        with:
          github-token: ''
          cli: ${{ needs.clojure-version.outputs.cli }}

      # On Windows setup-clojure downloads the MSI with `gh release download`,
      # which needs the GitHub CLI and a GitHub token (GitHub's image has both,
      # this runner neither). Same MSI and install folder, fetched anonymously.
      - name: Install Clojure CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Version picked by job clojure-version from deps.edn
          $ver = '${{ needs.clojure-version.outputs.cli }}'
          $name = "clojure-$ver.msi"
          $url = "https://github.com/casselc/clj-msi/releases/download/v$ver/$name"
          $msi = Join-Path $env:RUNNER_TEMP $name
          for ($i = 1; $i -le 5; $i++) {
            try { Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $msi; break }
            catch {
              if ($i -eq 5) { throw "download $url failed: $_" }
              Write-Host "download attempt $i failed, retry in 20s"
              Start-Sleep -Seconds 20
            }
          }
          $dir = 'C:\tools\ClojureTools'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /norestart APPLICATIONFOLDER=`"$dir`""
          # 0 ok, 3010 ok (reboot wanted), 1638 a newer version is already installed
          if ($p.ExitCode -notin 0, 3010, 1638) { throw "msiexec failed with exit code $($p.ExitCode)" }
          Write-Host "Clojure CLI $ver in $dir (msiexec $($p.ExitCode))"
          "CLOJURE_INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Install USBSID driver
        shell: bash
        run: |
          DIR="$HOME/.m2/repository/usbsid/usbsid-usb-driver-library-java/${{ env.DRIVERVER }}"
          mkdir -p "$DIR"
          cp assets/driver/${{ env.DRIVERJAR }} "$DIR/"
          cp assets/driver/${{ env.DRIVERPOM }} "$DIR/"

      - name: Install patched libusb4java (Windows native lib fix)
        shell: bash
        run: ./scripts/install-libusb4java.sh

      # Build uber LOCALLY on each platform runner so build.clj's host-jfx-alias
      # picks the matching mac classifier ($mac or $mac-aarch64) per host arch.
      # Using the shared Ubuntu-built uber from the `ci` job would never pull in
      # mac dylibs → JavaFX prism libs missing from .app → "no suitable pipeline".
      - name: Build uber locally (per-platform JavaFX classifier)
        shell: bash
        run: clojure -T:build uber

      # AppImage: update information on v* tags only (d* prereleases would
      # otherwise offer the older stable release as an update), signed when
      # the APPIMAGE_SIGN_* secrets exist
      - name: Build platform package
        shell: bash
        env:
          APPIMAGE_SIGN_KEY: ${{ secrets.APPIMAGE_SIGN_KEY }}
          APPIMAGE_SIGN_PASSPHRASE: ${{ secrets.APPIMAGE_SIGN_PASSPHRASE }}
          APPIMAGE_SIGN_PRIVATE_KEY: ${{ secrets.APPIMAGE_SIGN_PRIVATE_KEY }}
        run: |
          clojure -T:build package
          if [[ "${{ matrix.platform }}" == linux-appimage* ]]; then
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y appstream
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              export APPIMAGE_UPDATE_INFO="gh-releases-zsync|LouDnl|USBSID-Configtool|latest|USBSID-Configtool-*-$(uname -m).AppImage.zsync"
            fi
            if [[ "${{ matrix.platform }}" == linux-appimage-aarch64 ]]; then
              # Gitea's arm64 runner is x86_64 + qemu-user. An AppImage stores
              # its "AI\x02" marker in ELF header bytes 8-10, which the qemu
              # binfmt mask compares, so the kernel refuses it ("Exec format
              # error"). Pre-fetch appimagetool to the path build-appimage.sh
              # uses and blank those 3 bytes (it then runs extracted).
              T=target/appimagetool-aarch64.AppImage
              mkdir -p target
              curl -fsSL -o "$T" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
              printf '\0\0\0' | dd of="$T" bs=1 seek=8 count=3 conv=notrunc status=none
              chmod +x "$T"
            fi
            bash scripts/build-appimage.sh
          fi

      # Stage output with platform-tagged filenames so all six can coexist
      - name: Stage artifacts
        shell: bash
        run: |
          VERSION=$(cat resources/.version | tr -d '[:space:]')
          mkdir -p staging

          if [ "${{ matrix.platform }}" = "linux" ]; then
            (cd target/package && zip -r "../../staging/USBSID-Configtool-${VERSION}-linux.zip" USBSID-Configtool/)

          elif [[ "${{ matrix.platform }}" == linux-appimage* ]]; then
            cp target/appimage/*.AppImage staging/
            for f in target/appimage/*.zsync; do
              # no .zsync on d* tags: an "[ -e ] && cp" here would end the step with status 1
              if [ -e "$f" ]; then cp "$f" staging/; fi
            done

          elif [ "${{ matrix.platform }}" = "windows" ]; then
            cp target/package/*.msi "staging/USBSID-Configtool-${VERSION}-windows.msi"

          elif [ "${{ matrix.platform }}" = "macos-intel" ]; then
            cp target/package/*.dmg "staging/USBSID-Configtool-${VERSION}-macos-x86_64.dmg"

          elif [ "${{ matrix.platform }}" = "macos-arm" ]; then
            cp target/package/*.dmg "staging/USBSID-Configtool-${VERSION}-macos-aarch64.dmg"
          fi

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: staging/*

  # 4a. Delete unfinished draft prereleases, and prereleases older than 30 days (but keep at least 10)
  cleanup_previous_builds:
    name: Cleanup Previous Builds
    if: startsWith(github.ref, 'refs/tags/d')
    runs-on: ubuntu-latest
    needs: [ci, package]
    steps:
      # Same policy as the GitHub workflow, through Gitea's API: drafts left by
      # failed builds go; of the prereleases, the 10 newest stay, older ones go
      # once they are more than 30 days old.
      - name: Cleanup previous prereleases
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          api, tok = os.environ["API"], os.environ["TOKEN"]
          def call(method, path):
              req = urllib.request.Request(api + path, method=method,
                                           headers={"Authorization": "token " + tok})
              with urllib.request.urlopen(req) as r:
                  body = r.read()
                  return json.loads(body) if body else None
          releases, page = [], 1
          while True:
              batch = call("GET", f"/releases?limit=50&page={page}")
              if not batch: break
              releases += batch; page += 1
          releases.sort(key=lambda r: r["created_at"], reverse=True)
          now = datetime.datetime.now(datetime.timezone.utc)
          keep, delete = 0, []
          for r in releases:
              if not r["prerelease"]: continue
              if r["draft"]:
                  print("Will delete draft prerelease:", r["tag_name"]); delete.append(r["id"]); continue
              keep += 1
              if keep <= 10: continue
              age = (now - datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))).days
              if age <= 30: continue
              print("Will delete old prerelease:", r["tag_name"]); delete.append(r["id"])
          for rid in delete:
              call("DELETE", f"/releases/{rid}")
          print("Done.")
          PY

  # 4b. Tagged build pre-release - d* tags only
  prerelease:
    name: Publish Pre-release
    if: startsWith(github.ref, 'refs/tags/d')
    needs: [ci, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Download JAR and launchers
        uses: actions/download-artifact@v4
        with:
          name: jar-and-launchers
          path: dist-jar

      - name: Collect all release files
        run: |
          cp dist-jar/usbsid-configtool-*.jar dist/
          cp dist-jar/run.sh  dist/
          cp dist-jar/run.bat dist/

      - name: Create Pre-release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: Tagged build ${{ github.ref_name }}
          PRERELEASE: "true"
        run: |
          # Gitea's release API (the GitHub workflow uses a GitHub-only action).
          # Re-runs reuse the release of this tag and replace assets of the same name.
          set -euo pipefail
          auth=(-H "Authorization: token $TOKEN")
          id=$(curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" 2>/dev/null \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' || true)
          if [ -z "$id" ]; then
            payload=$(TAG="$TAG" TITLE="$TITLE" PRE="$PRERELEASE" python3 -c '
          import json, os
          body = open("release_notes.md").read() if os.path.exists("release_notes.md") else ""
          print(json.dumps({"tag_name": os.environ["TAG"], "name": os.environ["TITLE"],
                            "body": body, "prerelease": os.environ["PRE"] == "true"}))')
            id=$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -X POST \
                   "$API/releases" -d "$payload" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          echo "release id $id for $TAG"
          shopt -s nullglob
          for f in dist/*; do
            n=$(basename "$f")
            for old in $(curl -fsS "${auth[@]}" "$API/releases/$id/assets" \
                | python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==sys.argv[1]))' "$n"); do
              curl -fsS "${auth[@]}" -X DELETE "$API/releases/$id/assets/$old"
            done
            curl -fsS "${auth[@]}" -X POST -F "attachment=@$f" "$API/releases/$id/assets?name=$n" >/dev/null
            echo "uploaded $n"
          done

  # 4b. Stable release - v* tags only
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Download JAR and launchers
        uses: actions/download-artifact@v4
        with:
          name: jar-and-launchers
          path: dist-jar

      - name: Collect all release files
        run: |
          cp dist-jar/usbsid-configtool-*.jar dist/
          cp dist-jar/run.sh  dist/
          cp dist-jar/run.bat dist/

      - name: Create Release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: Release ${{ github.ref_name }}
          PRERELEASE: "false"
        run: |
          # Gitea's release API (the GitHub workflow uses a GitHub-only action).
          # Re-runs reuse the release of this tag and replace assets of the same name.
          set -euo pipefail
          auth=(-H "Authorization: token $TOKEN")
          id=$(curl -fsS "${auth[@]}" "$API/releases/tags/$TAG" 2>/dev/null \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' || true)
          if [ -z "$id" ]; then
            payload=$(TAG="$TAG" TITLE="$TITLE" PRE="$PRERELEASE" python3 -c '
          import json, os
          body = open("release_notes.md").read() if os.path.exists("release_notes.md") else ""
          print(json.dumps({"tag_name": os.environ["TAG"], "name": os.environ["TITLE"],
                            "body": body, "prerelease": os.environ["PRE"] == "true"}))')
            id=$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -X POST \
                   "$API/releases" -d "$payload" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          echo "release id $id for $TAG"
          shopt -s nullglob
          for f in dist/*; do
            n=$(basename "$f")
            for old in $(curl -fsS "${auth[@]}" "$API/releases/$id/assets" \
                | python3 -c 'import json,sys; print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"]==sys.argv[1]))' "$n"); do
              curl -fsS "${auth[@]}" -X DELETE "$API/releases/$id/assets/$old"
            done
            curl -fsS "${auth[@]}" -X POST -F "attachment=@$f" "$API/releases/$id/assets?name=$n" >/dev/null
            echo "uploaded $n"
          done
