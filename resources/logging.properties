handlers = java.util.logging.ConsoleHandler
# handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler
# .level = FINE
.level = INFO
# java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
# Format slots:
#   %1 = date/time
#   %2 = source class + method (Clojure callers via logging macros: "<ns> L<line>";
#        Java driver via inferred caller: "<class> <method>")
#   %3 = logger name (namespace)
#   %4 = level
#   %5 = message
# java.util.logging.SimpleFormatter.format = [%1$tF %1$tT] [%4$-7s] [%3$s] %5$s %n
# java.util.logging.SimpleFormatter.format = [%1$tF %1$tT %4$-7s - %3$s] %5$s %n
java.util.logging.SimpleFormatter.format = [%1$tF %1$tT %4$-7s - %2$s] %5$s %n

# usbsid.USBSIDDevice.level = FINE
usbsid.USBSIDDevice.level = INFO
